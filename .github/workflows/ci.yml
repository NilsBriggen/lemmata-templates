name: CI

# Every template must build, and index.json (what the app reads) must match the templates.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: index.json is up to date
        run: python3 -I scripts/build-index.py --check
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          package-file: .github/tex-packages.txt
      - name: Build every template
        run: python3 -I scripts/build.py
